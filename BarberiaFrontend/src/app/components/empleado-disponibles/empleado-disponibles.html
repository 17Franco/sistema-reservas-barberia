<div class="row">
    <div class="col-12 mb-4 fs-5 text fw-bold"><i class="bi bi-person me-2"></i>Barbero</div>
    <div class="col-12 d-flex align-items-center gap-2">
        <!--for que replica otro contenedor con -->
        @for (item of empleadoVisbles(); track item.id){
            <div class="card d-flex flex-column align-items-center empleado" style="width: 150px;" [class.selected]="item.id === EmpleadoSeleccionado" [class.disabled]="!item.disponible" (click)="item.disponible && seleccionarEmpleado(item)">
                <div class="foto-wrapper">
                    <img [src]="obtenerFoto(item.foto)" class="foto-barbero" alt="fotoBarbero">
                </div>
                
                <span class="text-muted small nombre-barbero">{{item.nombre +" "+ item.apellido}}</span>
                
            </div>
            
        }@empty {
            <div class="text-muted small">A ocurrio un error vuelva a intentar en otra vida</div>
        }
        
        <div class="d-flex flex-column align-items-center gap-2">
            <button class="btn border btnHover ms-2" [disabled]="paginaActual() === totalPaginas()" (click)="next()">
                <i class="bi bi-chevron-right text-primary fs-4"></i>
            </button>
            <span class="page-indicator">{{ paginaActual() }}/{{ totalPaginas() }}</span>
            <button class="btn border btnHover ms-2 " [disabled]="paginaActual() === 1" (click)="prev()">
                <i class="bi bi-chevron-left text-primary fs-4"></i>
            </button>
        </div>
        
    </div>
</div>
