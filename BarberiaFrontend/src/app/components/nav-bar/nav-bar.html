<nav class="navbar navbar-expand-lg navbar-light bg-light">

  <div class="container-fluid ">

    <div class="">

      <a class="navbar-brand">

        @if(modo === "Home"){

          <img src="logos/LogoReserva.png" class="logoHome" alt="">

        }

        @if(modo === "MiProfile"){

          <img src="logos/LogoMiPerfil2.png" class="logoHome" alt="">

        } 

        @if(modo === "admin"){

          <img src="logos/LogoPanelAdministrativo.png" class="logoHome" alt="">

        }

      </a>

    </div>



    <div class="gap-5 d-flex">

      <a class="link" (click)="cambiarModo('admin')" routerLink="/admin" [ngClass]="modo=== 'admin' ? 'text-primary' : 'text-secondary'">PANEL ADMINISTRATIVO</a> <!--BOTON SOLO PARA ADMINS.-->

      <a class="link" (click)="cambiarModo('Home')" routerLink="/" [ngClass]="modo=== 'Home' ? 'text-primary' : 'text-secondary'" >INICIO</a>

      <a class="link" (click)="cambiarModo('MiProfile')" routerLink="/MiPerfil" [ngClass]="modo=== 'MiProfile' ? 'text-primary' : 'text-secondary'">MI PERFIL</a>

    </div>



    <div class="d-flex align-items-center gap-2">

      <a class="profile-summary" routerLink="/MiPerfil" (click)="cambiarModo('MiProfile')">
        <span class="profile-avatar">
          @if(fotoPerfilUrl){
            <img [src]="fotoPerfilUrl" (error)="usarIniciales()" alt="Foto de perfil">
          } @else {
            <span>{{ inicialesUsuario }}</span>
          }
        </span>
        <span class="profile-name">{{ usuarioActual?.nombre || authService.usuario?.nombre }}</span>
      </a>

      <button class="btn btn-sm btn-outline-danger" type="button" (click)="logOut()">

        Cerrar sesión

      </button>

    </div>

  

  </div>

</nav>
