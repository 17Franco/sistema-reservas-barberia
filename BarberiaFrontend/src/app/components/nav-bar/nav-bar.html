<nav class="navbar navbar-expand-lg navbar-light ">

  <div class="" [ngClass]="admin ? 'container-fluid' : 'container'">

    <div class="">

      <a class="navbar-brand">

        @if(modo === "Home"){

          <img src="logos/LogoReserva.png" class="logoHome" alt="">

        }

        @if(modo === "MiProfile"){

          <img src="logos/LogoMiPerfil2.png" class="logoHome" alt="">

        } 

        @if(modo === "admin"){

          <img src="logos/LogoPanelAdministrativo.png" class="logoHome" alt="">

        }

      </a>

    </div>

    <div class="gap-5 d-flex">

      <a class="link fw-bold" [class.d-none]="!admin" (click)="cambiarModo('admin')" routerLink="/admin" [ngClass]="modo === 'admin' ? 'text-primary' : 'text-secondary'">PANEL ADMINISTRATIVO</a> <!--BOTON SOLO PARA ADMINS.-->

      <a class="link fw-bold" [class.d-none]="admin" (click)="cambiarModo('Home')" [routerLink]="empleado ? '/perfilBarbero' : '/'" [ngClass]="modo=== 'Home' ? 'text-primary' : 'text-secondary'" >INICIO</a>

      <a class="link fw-bold" [class.d-none]="admin || empleado"  (click)="cambiarModo('MiProfile')" routerLink="/MiPerfil" [ngClass]="modo=== 'MiProfile' ? 'text-primary' : 'text-secondary'">MI PERFIL</a>

    </div>



    <div class="d-flex align-items-center gap-2">
      <!--Si es empleado al tocar su foto o nombre va al perfil empleado si es usuario al de usuario-->
      <a
        class="profile-summary"
        [routerLink]="empleado ? '/perfilBarbero' : '/MiPerfil'"
        (click)="cambiarModo(empleado ? 'Home' : 'MiProfile')"
      >
        <span class="profile-avatar">
          @if(fotoPerfilUrl; as fotoUrl){
            <img [src]="fotoUrl" (error)="usarIniciales()" alt="Foto de perfil">
          } @else {
            <span>{{ inicialesUsuario }}</span>
          }
        </span>
        <!--Cargo el nombre del usuario desede el auth-->
        <span class="profile-name">{{ authService.usuario?.nombre || usuarioActual?.nombre }}</span>
      </a>

      <button class="btn btn-sm btn-outline-danger" type="button" (click)="logOut()">

        Cerrar sesión
        <i class="ms-1 bi bi-box-arrow-right"></i>
      </button>

    </div>

  </div>

</nav>
