
<form class="needs-validation" [formGroup]="formLogin" (ngSubmit)="login()" >
    <label for="email" class="form-label">Email o Ci</label>
    <div class="mb-3 input-group ">
        <div class="input-group-prepend">
            <span class="input-group-text" id="basic-addon1"><i class="bi bi-person"></i></span>
        </div>
        <input type="email" class="form-control " formControlName="ci" id="email" aria-describedby="emailHelp"  [class.is-invalid]="formLogin.get('ci')?.invalid && formLogin.get('ci')?.touched "> 
         @if(obtenerErrorCi()){
            <div class="invalid-feedback">
                {{obtenerErrorCi()}}
            </div>
        }
    </div>

    <label for="pass" class="form-label">Contraseña</label>
    <div class="mb-3 input-group">
        <div class="input-group-prepend">
            <span class="input-group-text" id="basic-addon1"><i class="bi bi-lock"></i></span>
        </div>
        <input type="password" class="form-control" formControlName="contraseña" id="pass" [class.is-invalid]="formLogin.get('contraseña')?.invalid && formLogin.get('contraseña')?.touched ">
        <div class="invalid-feedback">
                El campo no puede ser vacio.
        </div>
    </div>
   
    @if(mensajeError){
        <div class="alert alert-warning" role="alert">
            {{mensajeError}}
        </div>
    }
    <button type="submit" class="btn btn-primary w-100">Submit</button>
</form>
