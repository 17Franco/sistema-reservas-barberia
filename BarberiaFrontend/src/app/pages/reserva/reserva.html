<div class="container mt-3  ">

    <div class="row ">
        <div class="col-8   p-4">
            <div class="opciones mb-4">
                <app-calendario (diaSeleccionadoChange)="onDia($event)" ></app-calendario>
            </div>
            <div class="opciones mb-4">
                @if(reservaIniciada){
                <app-servicios-disponibles [dia]="diaSeleccionado"  (ServicioSeleccionadoChange)="onServicio($event)"></app-servicios-disponibles>
                }
                
            </div> 
            <div class="opciones mb-4">
                @if(reservaIniciada && servicioInicido){
                    <app-empleado-disponibles [dia]="diaSeleccionado" [servicio]="ServicioSeleccionado" (EmpleadoSeleccionadoChange)="onEmpleado($event)"></app-empleado-disponibles>
                }
            </div>
            <div class="opciones mb-4">
                @if(reservaIniciada && servicioInicido && HorarioInicido){
                    <app-horario-disponibles [dia]="diaSeleccionado" [servicio]="ServicioSeleccionado" [empleado]="EmpleadoSeleccionado" (HorarioSeleccionadoChange)="onHorario($event)" ></app-horario-disponibles>
                }
            </div>
        </div>
        <div class="col-4 ">
            <div class="resumen">
                <app-resumen-reserva [dia]="diaSeleccionado" [servicio]="ServicioSeleccionado" [empleado]="EmpleadoSeleccionado" [horario]="horarioSeleccionado" ></app-resumen-reserva>
            </div>
        </div>
    </div>

</div>
