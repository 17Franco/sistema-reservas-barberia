<div class="container-fluid">

  <main class="servicios-page">
    <section class="services-list">
      <h1>Servicios</h1>
      <div class="page-actions">
        <a routerLink="/" class="btn btn-secondary">Volver a inicio</a>
      </div>

      <div *ngIf="cargando" class="loading">Cargando servicios...</div>
      <div *ngIf="error" class="error">{{ error }}</div>

      <div class="services-grid" *ngIf="!cargando && !error">
        <article *ngFor="let servicio of servicios" class="service-item">
          <h3>{{ servicio.nombre }}</h3>
          <p>{{ servicio.descripcion }}</p>
          <div class="service-meta">
            <span class="price">${{ servicio.precio }}</span>
          </div>
        </article>
      </div>

      <div *ngIf="!cargando && !error && servicios.length === 0" class="empty-state">
        No hay servicios disponibles.
      </div>
    </section>
  </main>
</div>
